name: Publicar versión

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      solo_compilar:
        description: "Solo compilar el instalador, sin publicar el Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path zaynix/core/config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "numero=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $existe = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          "existe=$existe" >> $env:GITHUB_OUTPUT
          if ($existe -eq "true") { Write-Host "La versión $v ya está publicada." } else { Write-Host "Versión nueva: $v" }
          exit 0

      - name: Preparar Python
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.existe == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Instalar Inno Setup
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.existe == 'false'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Pruebas, compilación e instalador
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.existe == 'false'
        shell: pwsh
        run: ./tools/publicar.ps1

      - name: Notas de la versión
        if: steps.version.outputs.existe == 'false' && github.event_name == 'push'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.numero }}"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $seccion = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($v))\].*?\r?\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          $hash = (Get-Content "dist/ZaynixSetup-$v.exe.sha256").Split(' ')[0]
          $notas = @"
          $seccion

          ### Instalación
          Descarga ``ZaynixSetup-$v.exe`` y ejecútalo. Si Windows muestra "Windows protegió su PC", pulsa **Más información → Ejecutar de todas formas**.

          ### Verificación (SHA-256)
          ``$hash``
          "@
          [IO.File]::WriteAllText("$PWD/notas.md", $notas, (New-Object System.Text.UTF8Encoding $false))

      - name: Publicar el Release
        if: steps.version.outputs.existe == 'false' && github.event_name == 'push'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.numero }}"
          gh release create "v$v" "dist/ZaynixSetup-$v.exe" "dist/ZaynixSetup-$v.exe.sha256" `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Zaynix $v" --notes-file notas.md --latest

      - name: Guardar el instalador como artefacto
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ZaynixSetup-${{ steps.version.outputs.numero }}
          path: dist/*
          retention-days: 7
